name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tools
        run: python3 -I -c "import sys; print(sys.version)"; ssh -V
      - name: Unit tests
        run: sh tests/run.sh
      - name: CLI smoke (help, refusal exit code)
        run: |
          python3 -I scripts/release-sig --help >/dev/null
          set +e; python3 -I scripts/release-sig allowed-signers --principal "bad principal" --namespace x --pub README.md; rc=$?; set -e
          test "$rc" = 2
